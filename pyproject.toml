[project]
name = "kid-assistant"
version = "0.1.0"
description = "Extract facts with page citations from fund Key Information Documents (KIDs) using a local LLM"
readme = "README.md"
authors = [
    { name = "Mohammad Rababah", email = "119531086+rababahm@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.4",
]

[project.scripts]
kid-extract = "kid_assistant.extract:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
compare = [
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
